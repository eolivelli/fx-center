# CI: the JVM modules on JDK 11 (the project's language level) and the
# Android app on JDK 17 (what the Android Gradle plugin runs on; the app's own
# code is still compiled at the Java 11 level). Both artifacts are kept for a
# few days so a branch can be tried on a phone before it is merged.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: fx-center-desktop-jar
          path: desktop/target/fx-center-*.jar
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      # ubuntu-latest runners ship the Android SDK preinstalled.
      - name: Build and test the app
        working-directory: android
        run: ./gradlew --no-daemon test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fx-center-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
